<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Aboptic &amp; services</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f7f9;color:#222;padding-bottom:72px}
.pad{max-width:900px;margin:auto;padding:14px}
input{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.btn{background:#2a7fba;color:#fff;border:none;padding:11px 16px;border-radius:8px;font-size:16px;cursor:pointer;width:100%;margin-top:6px}
.btn.alt,.btn.soc{background:#fff;color:#222;border:1px solid #ccc}
.lnk{background:none;border:none;color:#2a7fba;text-decoration:underline;margin-top:10px;cursor:pointer;font-size:14px}
.box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#7b1e3a,#12355b 60%,#2a7fba);color:#fff;text-align:center;padding:50px 20px 80px}
.hero .big{font-size:60px;letter-spacing:6px}
.hero h1{font-size:30px;margin:10px 0}
.hero p{font-size:15px;line-height:1.5;opacity:.95}
.up{margin-top:-50px;position:relative}
.top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.top input{margin:0;flex:1;border-radius:24px}
.hb{font-size:28px;cursor:pointer}
.ban{background:linear-gradient(135deg,#7b1e3a,#c0392b);color:#fff;border-radius:14px;padding:22px 16px;margin-bottom:14px;text-align:center;font-size:18px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;text-align:center;font-size:13px}
.cats div{cursor:pointer}
.cats span{display:flex;width:72px;height:72px;margin:0 auto 4px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);align-items:center;justify-content:center;font-size:34px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px}
.chip{padding:7px 14px;border-radius:20px;background:#fff;border:1px solid #ccc;white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:#12355b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{position:relative;background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card .im{height:110px;display:flex;align-items:center;justify-content:center;font-size:56px}
.card img{max-width:100%;max-height:110px;border-radius:8px}
.fv{position:absolute;top:8px;right:10px;font-size:22px;cursor:pointer}
.side{display:flex;gap:10px}
.sl{width:100px;flex:none}
.sl div{padding:12px 6px;font-size:14px;background:#eee;cursor:pointer}
.sl div.on{background:#fff;font-weight:bold;border-left:4px solid #12355b}
.sr{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee;cursor:pointer}
.pay{background:#eef6fc;border-left:4px solid #2a7fba;padding:12px;margin:10px 0;border-radius:6px}
.prof{display:flex;gap:12px;align-items:center}
.av{width:54px;height:54px;border-radius:50%;background:#12355b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.ic{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:12px;margin-top:10px}
.ic div{cursor:pointer}
.ic span{display:block;font-size:28px;position:relative}
.ic i{position:absolute;top:-4px;right:10px;background:#c0392b;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-style:normal}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex}
nav div{flex:1;text-align:center;padding:8px 0;font-size:11px;cursor:pointer;color:#666}
nav div.on{color:#12355b;font-weight:bold}
nav span{display:block;font-size:22px}
small{color:#666}
a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div id='app'></div>
<nav id='nav' style='display:none'></nav>

<script type='module'>
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup, updatePassword, reauthenticateWithCredential, EmailAuthProvider, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyA_jCartiuNU73OO-NWCvM0g0aPRcNRbNc',
  authDomain: 'aboptic.firebaseapp.com',
  projectId: 'aboptic',
  storageBucket: 'aboptic.firebasestorage.app',
  messagingSenderId: '538771807407',
  appId: '1:538771807407:web:95de52ca862f2f6f26485a'
});
const auth = getAuth(app), db = getFirestore(app);
const WAAFI = '77 64 36 16', WA = '25377643616';
const CATS = [['Lunettes','👓'],['Robes','👗'],['Abayas','🧕'],['Chaussures','👠'],['Voiles','🧣'],['Accessoires','👜']];
const SAMPLE = [
  {id:'s1',name:'Monture classique noire',price:12000,cat:'Lunettes',emoji:'👓'},
  {id:'s2',name:'Robe femme élégante',price:18000,cat:'Robes',emoji:'👗'},
  {id:'s3',name:'Abaya noire brodée',price:25000,cat:'Abayas',emoji:'🧕'},
  {id:'s4',name:'Chaussures confort',price:14000,cat:'Chaussures',emoji:'👠'},
  {id:'s5',name:'Voile en soie',price:6000,cat:'Voiles',emoji:'🧣'},
  {id:'s6',name:'Sac à main',price:11000,cat:'Accessoires',emoji:'👜'}
];
const STEPS = [['recu_envoye','Paiement reçu'],['valide','Commande lancée'],['prete','Commande prête'],['expedie','En route Égypte → Djibouti'],['livre','Livrée']];
const G = {paid:['recu_envoye'], prep:['valide','prete'], ship:['expedie'], done:['livre']};
const TF = [['all','Tout'],['paid','Paiement reçu'],['prep','En préparation'],['ship','Expédiées'],['done','Livrées']];

let user = null, profile = {}, products = [], cart = {}, cat = 'Tous', q = '', view = 'home', tf = 'all', orders = [], busy = false, unsub = null, favs = [];
try{ favs = JSON.parse(localStorage.getItem('fav') || '[]'); }catch(e){ favs = []; }
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fdj = n => Number(n).toLocaleString() + ' FDJ';
const key = s => String(s).replace(/[^0-9a-z]/gi, '').toLowerCase();
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);

const HERO = `<div class='hero'><div class='big'>👓 👗 🧕</div><h1>Aboptic &amp; services</h1><p>Lunettes, robes, abayas, chaussures, voiles et accessoires<br>Livraison d’Égypte à Djibouti</p></div>`;

function authScreen(mode, msg){
  $('nav').style.display = 'none';
  const m = msg ? `<p style='color:#c0392b;margin:8px 0'>${msg}</p>` : '';
  let body;
  if(mode === 'login'){
    body = `<h2 style='margin-bottom:8px'>Bienvenue dans Aboptic &amp; services</h2>${m}
      <input id='lid' placeholder='E-mail, numéro ou nom d’utilisateur' autocapitalize='none'>
      <input id='lpw' type='password' placeholder='Mot de passe'>
      <button class='btn' onclick='login()'>Connexion</button>
      <button class='btn alt' data-m='signup' onclick='authScreen(this.dataset.m)'>Créer un compte</button>
      <div style='text-align:center'><button class='lnk' onclick='forgot()'>Mot de passe oublié ?</button></div>
      <p style='text-align:center;margin:12px 0 4px'><small>ou continuer avec</small></p>
      <button class='btn soc' onclick='social(1)'>Google</button>
      <button class='btn soc' onclick='social(0)'>Facebook</button>
      <button class='btn soc' onclick='social(0)'>Apple ID</button>`;
  } else {
    body = `<h2 style='margin-bottom:8px'>Créer mon compte</h2>${m}
      <input id='sn' placeholder='Nom complet'>
      <input id='su' placeholder='Nom d’utilisateur' autocapitalize='none'>
      <input id='sp' type='tel' placeholder='Numéro de téléphone'>
      <input id='se' type='email' placeholder='E-mail' autocapitalize='none'>
      <input id='sq' placeholder='Adresse : quartier où vous vivez'>
      <input id='spw' type='password' placeholder='Mot de passe (6 caractères minimum)'>
      <button class='btn' onclick='signup()'>Créer mon compte</button>
      <button class='btn alt' data-m='login' onclick='authScreen(this.dataset.m)'>J’ai déjà un compte</button>`;
  }
  $('app').innerHTML = HERO + `<div class='pad'><div class='box up'>${body}</div></div>`;
}

async function login(){
  const id = $('lid').value.trim(), pw = $('lpw').value;
  try{
    let email = id;
    if(!id.includes('@')){
      const s = await getDoc(doc(db, 'logins', key(id)));
      if(!s.exists()) throw new Error('x');
      email = s.data().email;
    }
    await signInWithEmailAndPassword(auth, email, pw);
  }catch(e){ authScreen('login', 'Identifiants incorrects.'); }
}

async function forgot(){
  const id = $('lid').value.trim();
  if(!id.includes('@')){ alert('Écrivez votre e-mail dans la première case, puis appuyez sur Mot de passe oublié.'); return; }
  try{ await sendPasswordResetEmail(auth, id); alert('Un e-mail pour changer le mot de passe vous a été envoyé.'); }
  catch(e){ alert('Envoi impossible. Vérifiez l’e-mail.'); }
}

async function signup(){
  const f = n => $(n).value.trim();
  const d = {name:f('sn'), username:f('su'), phone:f('sp'), email:f('se'), quartier:f('sq')};
  const pw = $('spw').value;
  if(Object.values(d).some(v => !v) || pw.length < 6){ authScreen('signup', 'Remplissez tout (mot de passe : 6 caractères minimum).'); return; }
  busy = true;
  try{
    const c = await createUserWithEmailAndPassword(auth, d.email, pw);
    try{
      await setDoc(doc(db, 'users', c.user.uid), d);
      await setDoc(doc(db, 'logins', key(d.username)), {email:d.email});
      await setDoc(doc(db, 'logins', key(d.phone)), {email:d.email});
    }catch(e2){ console.log(e2); }
    await signOut(auth);
    busy = false;
    authScreen('login', `<span style='color:#2e8b57'>Compte créé. Connectez-vous.</span>`);
  }catch(e){ busy = false; try{ await signOut(auth); }catch(e3){} authScreen('signup', 'Erreur : cet e-mail ou ce nom est peut-être déjà utilisé.'); }
}

async function social(ok){
  if(!ok){ alert('Cette connexion sera activée bientôt. Utilisez Google ou votre e-mail.'); return; }
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ alert('Connexion Google impossible.'); }
}

onAuthStateChanged(auth, async u => {
  if(busy) return;
  user = u;
  if(unsub){ unsub(); unsub = null; }
  if(!u){ authScreen('login'); return; }
  try{
    const s = await getDoc(doc(db, 'users', u.uid));
    profile = s.exists() ? s.data() : {name:u.displayName || '', email:u.email};
  }catch(e){ profile = {name:u.displayName || '', email:u.email}; }
  try{
    const p = await getDocs(collection(db, 'products'));
    products = p.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ products = []; }
  if(!products.length) products = SAMPLE;
  try{
    unsub = onSnapshot(query(collection(db, 'orders'), where('uid', '==', u.uid)), snap => {
      orders = snap.docs.map(d => d.data()).sort((a, b) => b.createdAt - a.createdAt);
      if(view === 'track' || view === 'profile') render();
    }, () => {});
  }catch(e){}
  view = 'home';
  render();
});

function items(){
  return Object.keys(cart).map(id => ({...products.find(p => p.id === id), qty:cart[id]})).filter(i => i.name);
}
const sum = () => items().reduce((s, i) => s + i.price * i.qty, 0);
const filtered = () => products.filter(p => (cat === 'Tous' || p.cat === cat) && String(p.name).toLowerCase().includes(q.toLowerCase()));
const gridHtml = L => L.map(card).join('') || '<p>Aucun produit trouvé.</p>';

function card(p){
  const im = p.photo ? `<img src='${p.photo}'>` : (p.emoji || '🛍️');
  const h = favs.includes(p.id) ? '❤️' : '🤍';
  return `<div class='card'><span class='fv' data-id='${p.id}' onclick='fav(this.dataset.id)'>${h}</span><div class='im'>${im}</div><b>${esc(p.name)}</b><div style='color:#12355b;font-weight:bold;margin:6px 0'>${fdj(p.price)}</div><button class='btn' data-id='${p.id}' onclick='add(this.dataset.id)'>Ajouter</button></div>`;
}

const chipsHtml = () => ['Tous', ...CATS.map(c => c[0])].map(c => `<span class='chip ${c === cat ? 'on' : ''}' data-c='${c}' onclick='setCat(this.dataset.c)'>${c}</span>`).join('');
const searchBar = () => `<div class='top'><input id='q' placeholder='🔍 Rechercher un produit' value='${esc(q)}' oninput='setQ(this.value)'><span class='hb' data-v='fav' onclick='show(this.dataset.v)'>♡</span></div>`;

function homeV(){
  return `${searchBar()}
    <div class='ban'><b>Nouvelle collection</b><br>Abayas, robes, voiles, chaussures, lunettes<br><small style='color:#fff'>Livraison d’Égypte à Djibouti</small></div>
    <div class='cats'>${CATS.map(c => `<div data-c='${c[0]}' onclick='goCat(this.dataset.c)'><span>${c[1]}</span>${c[0]}</div>`).join('')}</div>
    <div class='chips'>${chipsHtml()}</div>
    <div class='grid' id='grid'>${gridHtml(filtered())}</div>`;
}

function catsV(){
  const names = ['Tous', ...CATS.map(c => c[0])];
  return `<div class='side'><div class='sl'>${names.map(c => `<div class='${c === cat ? 'on' : ''}' data-c='${c}' onclick='setCat(this.dataset.c)'>${c}</div>`).join('')}</div>
    <div class='sr'><input id='q' placeholder='🔍 Rechercher' value='${esc(q)}' oninput='setQ(this.value)'><div class='grid' id='grid'>${gridHtml(filtered())}</div></div></div>`;
}

function favV(){
  const L = products.filter(p => favs.includes(p.id));
  return `<h3 style='margin-bottom:10px'>Ma liste d’envies</h3><div class='grid' id='grid'>${L.length ? gridHtml(L) : '<p>Appuyez sur le cœur d’un produit pour le retrouver ici.</p>'}</div>`;
}

function cartV(){
  const L = items();
  if(!L.length) return `<div class='box'>Votre panier est vide.</div>`;
  return `<div class='box'>${L.map(i => `<div class='row'><span>${esc(i.name)}<br><small>${fdj(i.price)}</small></span><span><button class='chip' data-id='${i.id}' onclick='dec(this.dataset.id)'>−</button> ${i.qty} <button class='chip' data-id='${i.id}' onclick='add(this.dataset.id)'>+</button></span></div>`).join('')}<p style='margin-top:10px'><b>Total : ${fdj(sum())}</b></p></div><button class='btn' data-v='pay' onclick='show(this.dataset.v)'>Passer au paiement</button>`;
}

function payV(){
  const L = items();
  if(!L.length) return cartV();
  const rx = L.some(i => i.cat === 'Lunettes');
  const t = sum(), p1 = Math.round(t * 0.7);
  return `<div class='box'><h3 style='margin-bottom:8px'>Paiement</h3><p>Total : <b>${fdj(t)}</b></p>
    <label>Adresse de résidence (quartier)</label>
    <input id='qt' value='${esc(profile.quartier || '')}' placeholder='Quartier où vous vivez'>
    ${rx ? `<label>Photo de l’ordonnance (lunettes)</label><input id='rx' type='file' accept='image/*'>` : ''}
    <div class='pay'><p>1. Payez maintenant 70 % : <b>${fdj(p1)}</b> par WAAFI au <b>${WAAFI}</b></p><p style='margin-top:6px'>2. Le reste, 30 % : <b>${fdj(t - p1)}</b>, à la réception.</p></div>
    <label>Photo du reçu de paiement</label>
    <input id='rc' type='file' accept='image/*'>
    <button class='btn' onclick='sendOrder()'>Envoyer ma commande</button></div>`;
}

function trackV(){
  const chips = `<div class='chips'>${TF.map(t => `<span class='chip ${t[0] === tf ? 'on' : ''}' data-t='${t[0]}' onclick='goT(this.dataset.t)'>${t[1]}</span>`).join('')}</div>`;
  const L = tf === 'all' ? orders : orders.filter(o => G[tf].includes(o.status));
  if(!L.length) return chips + `<div class='box'>Aucune commande ici pour le moment.</div>`;
  return chips + L.map(o => {
    const at = STEPS.findIndex(s => s[0] === o.status);
    const st = o.status === 'refuse' ? '❌ Commande refusée, contactez-nous.' : STEPS.map((s, k) => `<div>${k <= at ? '✅' : '⚪'} ${s[1]}</div>`).join('');
    return `<div class='box'><b>${new Date(o.createdAt).toLocaleDateString('fr-FR')}</b> - ${fdj(o.total)}<br><small>${(o.items || []).map(i => esc(i.name) + ' x' + i.qty).join(', ')}</small><div style='margin-top:8px'>${st}</div></div>`;
  }).join('') + `<a href='https://wa.me/${WA}' target='_blank'><button class='btn alt'>Nous contacter sur WhatsApp</button></a>`;
}

function profV(){
  const n = k => orders.filter(o => G[k].includes(o.status)).length;
  const ic = [['paid','💳','Paiement reçu'],['prep','🛠️','En préparation'],['ship','🚚','Expédiées'],['done','✅','Livrées']];
  return `<div class='box prof'><div class='av'>${esc((profile.name || user.email || '?').charAt(0).toUpperCase())}</div><div><b>${esc(profile.name || 'Mon profil')}</b><br><small>${esc(user.email || '')}</small></div></div>
    <div class='box'><div class='row' data-t='all' onclick='goT(this.dataset.t)'><b>Mes commandes</b><span>Voir tout ›</span></div>
      <div class='ic'>${ic.map(x => `<div data-t='${x[0]}' onclick='goT(this.dataset.t)'><span>${x[1]}${n(x[0]) ? `<i>${n(x[0])}</i>` : ''}</span>${x[2]}</div>`).join('')}</div></div>
    <div class='box'>
      <div class='row' data-v='fav' onclick='show(this.dataset.v)'><span>❤️ Liste d’envies (${favs.length})</span><span>›</span></div>
      <div class='row' data-v='pwd' onclick='show(this.dataset.v)'><span>🔒 Changer le mot de passe</span><span>›</span></div>
      <a href='https://wa.me/${WA}' target='_blank'><div class='row'><span>💬 Service client (WhatsApp)</span><span>›</span></div></a>
    </div>
    <div class='box'><label>Mon adresse : quartier</label><input id='aq' value='${esc(profile.quartier || '')}' placeholder='Quartier où vous vivez'><button class='btn' onclick='saveAddr()'>Enregistrer l’adresse</button></div>
    <button class='btn alt' onclick='logout()'>Se déconnecter</button>`;
}

function pwdV(){
  const hasPw = user.providerData.some(p => p.providerId === 'password');
  const back = `<button class='btn alt' data-v='profile' onclick='show(this.dataset.v)'>Retour</button>`;
  if(!hasPw) return `<div class='box'>Votre compte utilise Google : le mot de passe se change dans votre compte Google.</div>${back}`;
  return `<div class='box'><h3 style='margin-bottom:8px'>Changer le mot de passe</h3>
    <input id='op' type='password' placeholder='Mot de passe actuel'>
    <input id='np' type='password' placeholder='Nouveau mot de passe (6 caractères minimum)'>
    <input id='np2' type='password' placeholder='Confirmer le nouveau mot de passe'>
    <button class='btn' onclick='chgPwd()'>Enregistrer</button></div>${back}`;
}

function navR(){
  const tabs = [['home','🏠','Accueil'], ['cats','🗂️','Catégories'], ['cart','🛒','Panier' + (count() ? ' (' + count() + ')' : '')], ['track','📦','Suivi'], ['profile','👤','Moi']];
  const on = {pay:'cart', fav:'profile', pwd:'profile'}[view] || view;
  $('nav').style.display = 'flex';
  $('nav').innerHTML = tabs.map(t => `<div class='${on === t[0] ? 'on' : ''}' data-v='${t[0]}' onclick='show(this.dataset.v)'><span>${t[1]}</span>${t[2]}</div>`).join('');
}

function render(){
  navR();
  $('app').innerHTML = `<div class='pad'>${({home:homeV, cats:catsV, cart:cartV, pay:payV, track:trackV, fav:favV, pwd:pwdV, profile:profV})[view]()}</div>`;
}

function refreshList(){
  if(view === 'home' || view === 'cats'){ $('grid').innerHTML = gridHtml(filtered()); }
  else render();
}
function fav(id){
  favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
  try{ localStorage.setItem('fav', JSON.stringify(favs)); }catch(e){}
  refreshList();
}
function add(id){ cart[id] = (cart[id] || 0) + 1; if(view === 'home' || view === 'cats' || view === 'fav') navR(); else render(); }
function dec(id){ cart[id]--; if(cart[id] <= 0) delete cart[id]; render(); }
function show(v){ view = v; render(); window.scrollTo(0, 0); }
function goT(t){ tf = t; show('track'); }
function goCat(c){ cat = c; render(); $('grid').scrollIntoView(); }
function setCat(c){ cat = c; render(); }
function setQ(v){ q = v; $('grid').innerHTML = gridHtml(filtered()); }
function logout(){ cart = {}; signOut(auth); }

async function saveAddr(){
  const v = $('aq').value.trim();
  if(!v){ alert('Écrivez votre quartier.'); return; }
  try{ await setDoc(doc(db, 'users', user.uid), {quartier:v}, {merge:true}); profile.quartier = v; alert('Adresse enregistrée.'); }
  catch(e){ alert('Erreur, réessayez.'); }
}

async function chgPwd(){
  const o = $('op').value, n = $('np').value, n2 = $('np2').value;
  if(n.length < 6 || n !== n2){ alert('Les deux nouveaux mots de passe doivent être identiques (6 caractères minimum).'); return; }
  try{
    await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, o));
    await updatePassword(user, n);
    alert('Mot de passe changé.');
    show('profile');
  }catch(e){ alert('Mot de passe actuel incorrect.'); }
}

function shrink(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 800 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function sendOrder(){
  const quartier = $('qt').value.trim();
  const needRx = items().some(i => i.cat === 'Lunettes');
  const rxf = needRx ? $('rx').files[0] : null;
  const rcf = $('rc').files[0];
  if(!quartier || (needRx && !rxf) || !rcf){ alert('Le quartier, la photo de l’ordonnance (lunettes) et la photo du reçu sont obligatoires.'); return; }
  try{
    const t = sum(), p1 = Math.round(t * 0.7);
    const ref = doc(collection(db, 'orders'));
    await setDoc(ref, {id:ref.id, uid:user.uid, name:profile.name || '', phone:profile.phone || '', quartier:quartier, items:items().map(i => ({name:i.name, qty:i.qty, price:i.price, cat:i.cat})), total:t, part1:p1, part2:t - p1, rx:rxf ? 'photo jointe' : '', rxPhoto:rxf ? await shrink(rxf) : '', receipt:await shrink(rcf), status:'recu_envoye', createdAt:Date.now(), receiptAt:Date.now()});
    await setDoc(doc(db, 'users', user.uid), {quartier:quartier}, {merge:true});
    profile.quartier = quartier;
    cart = {};
    goT('all');
  }catch(e){ alert('Erreur, réessayez.'); }
}
