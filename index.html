<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Aboptic &amp; services</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f7f9;color:#222;padding-bottom:70px}
header{background:#12355b;color:#fff;padding:14px;text-align:center;font-size:20px;font-weight:bold}
main{max-width:900px;margin:auto;padding:14px}
input{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.btn{background:#2a7fba;color:#fff;border:none;padding:11px 16px;border-radius:8px;font-size:16px;cursor:pointer;width:100%;margin-top:6px}
.btn.alt,.btn.soc{background:#fff;color:#222;border:1px solid #ccc}
.box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card .im{height:110px;display:flex;align-items:center;justify-content:center;font-size:56px}
.card img{max-width:100%;max-height:110px;border-radius:8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px}
.chip{padding:7px 14px;border-radius:20px;background:#fff;border:1px solid #ccc;white-space:nowrap;cursor:pointer}
.chip.on{background:#12355b;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
.pay{background:#eef6fc;border-left:4px solid #2a7fba;padding:12px;margin:10px 0;border-radius:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex}
nav div{flex:1;text-align:center;padding:8px 0;font-size:12px;cursor:pointer;color:#666}
nav div.on{color:#12355b;font-weight:bold}
nav span{display:block;font-size:22px}
small{color:#666}
</style>
</head>
<body>
<header>Aboptic &amp; services</header>
<main id='app'></main>
<nav id='nav' style='display:none'></nav>

<script type='module'>
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyA_jCartiuNU73OO-NWCvM0g0aPRcNRbNc',
  authDomain: 'aboptic.firebaseapp.com',
  projectId: 'aboptic',
  storageBucket: 'aboptic.firebasestorage.app',
  messagingSenderId: '538771807407',
  appId: '1:538771807407:web:95de52ca862f2f6f26485a'
});
const auth = getAuth(app), db = getFirestore(app);
const WAAFI = '77 64 36 16', WA = '25377643616';
const CATS = ['Lunettes','Robes','Abayas','Chaussures','Voiles','Accessoires'];
const SAMPLE = [
  {id:'s1',name:'Monture classique noire',price:12000,cat:'Lunettes',emoji:'👓'},
  {id:'s2',name:'Robe femme élégante',price:18000,cat:'Robes',emoji:'👗'},
  {id:'s3',name:'Abaya noire brodée',price:25000,cat:'Abayas',emoji:'🧕'},
  {id:'s4',name:'Chaussures confort',price:14000,cat:'Chaussures',emoji:'👠'},
  {id:'s5',name:'Voile en soie',price:6000,cat:'Voiles',emoji:'🧣'},
  {id:'s6',name:'Sac à main',price:11000,cat:'Accessoires',emoji:'👜'}
];
const STEPS = [['recu_envoye','Paiement reçu'],['valide','Commande lancée'],['prete','Commande prête'],['expedie','En route Égypte → Djibouti'],['livre','Livrée']];

let user = null, profile = {}, products = [], cart = {}, cat = 'Tous', q = '', view = 'home', orders = [], busy = false, unsub = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fdj = n => Number(n).toLocaleString() + ' FDJ';
const key = s => String(s).replace(/[^0-9a-z]/gi, '').toLowerCase();
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);

function authScreen(mode, msg){
  $('nav').style.display = 'none';
  const m = msg ? `<p style='color:#c0392b;margin:8px 0'>${msg}</p>` : '';
  if(mode === 'login'){
    $('app').innerHTML = `<div class='box'><h2 style='margin-bottom:8px'>Bienvenue dans Aboptic &amp; services</h2>${m}
      <input id='lid' placeholder='E-mail, numéro ou nom d’utilisateur' autocapitalize='none'>
      <input id='lpw' type='password' placeholder='Mot de passe'>
      <button class='btn' onclick='login()'>Connexion</button>
      <button class='btn alt' data-m='signup' onclick='authScreen(this.dataset.m)'>Créer un compte</button>
      <p style='text-align:center;margin:14px 0 4px'><small>ou continuer avec</small></p>
      <button class='btn soc' onclick='social(1)'>Google</button>
      <button class='btn soc' onclick='social(0)'>Facebook</button>
      <button class='btn soc' onclick='social(0)'>Apple ID</button></div>`;
  } else {
    $('app').innerHTML = `<div class='box'><h2 style='margin-bottom:8px'>Créer mon compte</h2>${m}
      <input id='sn' placeholder='Nom complet'>
      <input id='su' placeholder='Nom d’utilisateur' autocapitalize='none'>
      <input id='sp' type='tel' placeholder='Numéro de téléphone'>
      <input id='se' type='email' placeholder='E-mail' autocapitalize='none'>
      <input id='sq' placeholder='Adresse : quartier où vous vivez'>
      <input id='spw' type='password' placeholder='Mot de passe (6 caractères minimum)'>
      <button class='btn' onclick='signup()'>Créer mon compte</button>
      <button class='btn alt' data-m='login' onclick='authScreen(this.dataset.m)'>J’ai déjà un compte</button></div>`;
  }
}

async function login(){
  const id = $('lid').value.trim(), pw = $('lpw').value;
  try{
    let email = id;
    if(!id.includes('@')){
      const s = await getDoc(doc(db, 'logins', key(id)));
      if(!s.exists()) throw new Error('x');
      email = s.data().email;
    }
    await signInWithEmailAndPassword(auth, email, pw);
  }catch(e){ authScreen('login', 'Identifiants incorrects.'); }
}

async function signup(){
  const f = n => $(n).value.trim();
  const d = {name:f('sn'), username:f('su'), phone:f('sp'), email:f('se'), quartier:f('sq')};
  const pw = $('spw').value;
  if(Object.values(d).some(v => !v) || pw.length < 6){ authScreen('signup', 'Remplissez tout (mot de passe : 6 caractères minimum).'); return; }
  busy = true;
  try{
    const c = await createUserWithEmailAndPassword(auth, d.email, pw);
    try{
      await setDoc(doc(db, 'users', c.user.uid), d);
      await setDoc(doc(db, 'logins', key(d.username)), {email:d.email});
      await setDoc(doc(db, 'logins', key(d.phone)), {email:d.email});
    }catch(e2){ console.log(e2); }
    await signOut(auth);
    busy = false;
    authScreen('login', '');
    $('app').insertAdjacentHTML('afterbegin', `<p style='color:#2e8b57;margin-bottom:8px'>Compte créé. Connectez-vous.</p>`);
  }catch(e){ busy = false; try{ await signOut(auth); }catch(e3){} authScreen('signup', 'Erreur : cet e-mail ou ce nom est peut-être déjà utilisé.'); }
}

async function social(ok){
  if(!ok){ alert('Cette connexion sera activée bientôt. Utilisez Google ou votre e-mail.'); return; }
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ alert('Connexion Google impossible.'); }
}

onAuthStateChanged(auth, async u => {
  if(busy) return;
  user = u;
  if(unsub){ unsub(); unsub = null; }
  if(!u){ authScreen('login'); return; }
  try{
    const s = await getDoc(doc(db, 'users', u.uid));
    profile = s.exists() ? s.data() : {name:u.displayName || '', email:u.email};
  }catch(e){ profile = {name:u.displayName || '', email:u.email}; }
  try{
    const p = await getDocs(collection(db, 'products'));
    products = p.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ products = []; }
  if(!products.length) products = SAMPLE;
  try{
    unsub = onSnapshot(query(collection(db, 'orders'), where('uid', '==', u.uid)), snap => {
      orders = snap.docs.map(d => d.data()).sort((a, b) => b.createdAt - a.createdAt);
      if(view === 'track') render();
    }, () => {});
  }catch(e){}
  view = 'home';
  render();
});

function items(){
  return Object.keys(cart).map(id => ({...products.find(p => p.id === id), qty:cart[id]})).filter(i => i.name);
}
const sum = () => items().reduce((s, i) => s + i.price * i.qty, 0);
const filtered = () => products.filter(p => (cat === 'Tous' || p.cat === cat) && String(p.name).toLowerCase().includes(q.toLowerCase()));

function card(p){
  const im = p.photo ? `<img src='${p.photo}'>` : (p.emoji || '🛍️');
  return `<div class='card'><div class='im'>${im}</div><b>${esc(p.name)}</b><div style='color:#12355b;font-weight:bold;margin:6px 0'>${fdj(p.price)}</div><button class='btn' data-id='${p.id}' onclick='add(this.dataset.id)'>Ajouter</button></div>`;
}

function homeV(){
  return `<input id='q' placeholder='🔍 Rechercher un produit' value='${esc(q)}' oninput='setQ(this.value)'>
    <div class='chips'>${['Tous', ...CATS].map(c => `<span class='chip ${c === cat ? 'on' : ''}' data-c='${c}' onclick='setCat(this.dataset.c)'>${c}</span>`).join('')}</div>
    <div class='grid' id='grid'>${filtered().map(card).join('') || '<p>Aucun produit trouvé.</p>'}</div>`;
}

function cartV(){
  const L = items();
  if(!L.length) return `<div class='box'>Votre panier est vide.</div>`;
  return `<div class='box'>${L.map(i => `<div class='row'><span>${esc(i.name)}<br><small>${fdj(i.price)}</small></span><span><button class='chip' data-id='${i.id}' onclick='dec(this.dataset.id)'>−</button> ${i.qty} <button class='chip' data-id='${i.id}' onclick='add(this.dataset.id)'>+</button></span></div>`).join('')}<p style='margin-top:10px'><b>Total : ${fdj(sum())}</b></p></div><button class='btn' data-v='pay' onclick='show(this.dataset.v)'>Passer au paiement</button>`;
}

function payV(){
  const L = items();
  if(!L.length) return cartV();
  const rx = L.some(i => i.cat === 'Lunettes');
  const t = sum(), p1 = Math.round(t * 0.7);
  return `<div class='box'><h3 style='margin-bottom:8px'>Paiement</h3><p>Total : <b>${fdj(t)}</b></p>
    <label>Adresse de résidence (quartier)</label>
    <input id='qt' value='${esc(profile.quartier || '')}' placeholder='Quartier où vous vivez'>
    ${rx ? `<label>Photo de l’ordonnance (lunettes)</label><input id='rx' type='file' accept='image/*'>` : ''}
    <div class='pay'><p>1. Payez maintenant 70 % : <b>${fdj(p1)}</b> par WAAFI au <b>${WAAFI}</b></p><p style='margin-top:6px'>2. Le reste, 30 % : <b>${fdj(t - p1)}</b>, à la réception.</p></div>
    <label>Photo du reçu de paiement</label>
    <input id='rc' type='file' accept='image/*'>
    <button class='btn' onclick='sendOrder()'>Envoyer ma commande</button></div>`;
}

function trackV(){
  if(!orders.length) return `<div class='box'>Aucune commande pour le moment.</div>`;
  return orders.map(o => {
    const at = STEPS.findIndex(s => s[0] === o.status);
    const st = o.status === 'refuse' ? '❌ Commande refusée, contactez-nous.' : STEPS.map((s, k) => `<div>${k <= at ? '✅' : '⚪'} ${s[1]}</div>`).join('');
    return `<div class='box'><b>${new Date(o.createdAt).toLocaleDateString('fr-FR')}</b> - ${fdj(o.total)}<br><small>${(o.items || []).map(i => esc(i.name) + ' x' + i.qty).join(', ')}</small><div style='margin-top:8px'>${st}</div></div>`;
  }).join('') + `<a href='https://wa.me/${WA}' target='_blank'><button class='btn alt'>Nous contacter sur WhatsApp</button></a>`;
}

function profV(){
  return `<div class='box'><h3>${esc(profile.name || user.email)}</h3><p>${esc(user.email || '')}</p><p>${esc(profile.phone || '')}</p><p>Quartier : ${esc(profile.quartier || 'à renseigner au paiement')}</p></div><button class='btn alt' onclick='logout()'>Déconnexion</button>`;
}

function navR(){
  const tabs = [['home','🏠','Accueil'], ['cart','🛒','Panier' + (count() ? ' (' + count() + ')' : '')], ['track','📦','Suivi'], ['profile','👤','Profil']];
  $('nav').style.display = 'flex';
  $('nav').innerHTML = tabs.map(t => `<div class='${(view === t[0] || (view === 'pay' && t[0] === 'cart')) ? 'on' : ''}' data-v='${t[0]}' onclick='show(this.dataset.v)'><span>${t[1]}</span>${t[2]}</div>`).join('');
}

function render(){
  navR();
  $('app').innerHTML = ({home:homeV, cart:cartV, pay:payV, track:trackV, profile:profV})[view]();
}

function add(id){ cart[id] = (cart[id] || 0) + 1; if(view === 'home') navR(); else render(); }
function dec(id){ cart[id]--; if(cart[id] <= 0) delete cart[id]; render(); }
function show(v){ view = v; render(); window.scrollTo(0, 0); }
function setCat(c){ cat = c; render(); }
function setQ(v){ q = v; $('grid').innerHTML = filtered().map(card).join('') || '<p>Aucun produit trouvé.</p>'; }
function logout(){ cart = {}; signOut(auth); }

function shrink(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 800 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function sendOrder(){
  const quartier = $('qt').value.trim();
  const needRx = items().some(i => i.cat === 'Lunettes');
  const rxf = needRx ? $('rx').files[0] : null;
  const rcf = $('rc').files[0];
  if(!quartier || (needRx && !rxf) || !rcf){ alert('Le quartier, la photo de l’ordonnance (lunettes) et la photo du reçu sont obligatoires.'); return; }
  try{
    const t = sum(), p1 = Math.round(t * 0.7);
    const ref = doc(collection(db, 'orders'));
    await setDoc(ref, {id:ref.id, uid:user.uid, name:profile.name || '', phone:profile.phone || '', quartier:quartier, items:items().map(i => ({name:i.name, qty:i.qty, price:i.price, cat:i.cat})), total:t, part1:p1, part2:t - p1, rx:rxf ? 'photo jointe' : '', rxPhoto:rxf ? await shrink(rxf) : '', receipt:await shrink(rcf), status:'recu_envoye', createdAt:Date.now(), receiptAt:Date.now()});
    await setDoc(doc(db, 'users', user.uid), {quartier:quartier}, {merge:true});
    profile.quartier = quartier;
    cart = {};
    show('track');
  }catch(e){ alert('Erreur, réessayez.'); }
}

Object.assign(window, {authScreen, login, signup, social, add, dec, show, setCat, setQ, logout, sendOrder});
</script>
</body>
</html>
